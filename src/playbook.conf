<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>SlateDesktop</Name>
    <Username>QuiteAFancyEmerald</Username>
    <Title>Slate Desktop Playbook</Title>
    <ShortDescription>Slate Desktop is a fork of ReviOS Playbook for Windows 11 LTSC</ShortDescription>
    <Description>Contemporary Ricing Setup CLI for Windows 11 LTSC forked from ReviOS</Description>
    <Details>Collection of performance enhancements, system optimizations, and streamlined productivity tools—all wrapped in a sleek, modern design with an elegant acrylic touch.</Details>
    <Version>1.0</Version>
    <UniqueId>6a93ec26-284d-4943-9fc4-c9616def55c6</UniqueId>
    <UpgradableFrom>any</UpgradableFrom>
    <SupportedBuilds>
        <string>22631</string>
        <string>26100</string>
        <string>26200</string>
    </SupportedBuilds>
    <Requirements>
        <Requirement>DefenderToggled</Requirement>
        <Requirement>NoPendingUpdates</Requirement>
        <Requirement>NoAntivirus</Requirement>
        <Requirement>Internet</Requirement>
        <Requirement>PluggedIn</Requirement>
    </Requirements>
    <UseKernelDriver>false</UseKernelDriver>
    <!-- <ProductCode>32</ProductCode> -->
    <Git>https://github.com/QuiteAFancyEmerald/Slate-Desktop-for-Windows-11</Git>
    <Website>https://www.deviantart.com/quiteafancyemerald/art/1106725305</Website>
    <InstallGuide>https://github.com/QuiteAFancyEmerald/Slate-Desktop-for-Windows-11</InstallGuide>
    <SupportsISO>true</SupportsISO>
	<ISO>
		<DisableBitLocker>true</DisableBitLocker>
		<DisableHardwareRequirements>true</DisableHardwareRequirements>
	</ISO>
	<OOBE>
		<BulletPoints>
			<BulletPoint Icon="Privacy" Title="Performance/Privacy" Description="Enjoy faster boot times, no bloat, reduced idle memory, reduced latency, and optimized resource usage for gaming and productivity."/>
            <BulletPoint Icon="Rocket" Title="Sleek Design" Description="Work with a modern aesthetic. Custom icons, explorer and other shell mods to make Windows 11 into Windows 12."/>
			<BulletPoint Icon="Rocket" Title="Improved Productivity" Description="Utilize workflow enhancements including a built-in tiling manager, context menu tools, system tools, command launchers, and more."/>
            <BulletPoint Icon="Rocket" Title="Windows Updates" Description="Supports any security or feature updates to Windows unlike many other mods."/>
			<BulletPoint Icon="Lock" Title="Revision Tool" Description="Forked from ReviOS, fine-tune your system with their dedicated tool for advanced customization, performance and optimization."/>
		</BulletPoints>
        <Internet>Request</Internet> 
	</OOBE>
    <Software>
        <Package Option="browser-helium" DefaultWebBrowser="true">
            <Name>helium</Name>
            <Title>Helium</Title>
            <Description>The ungoogled-chromium-based web browser made for people, with love. Best privacy by default, unbiased ad-blocking, no bloat and no noise.</Description>
            <Icon>helium.png</Icon>
        </Package>
		<Package Option="browser-zen" DefaultWebBrowser="true">
			<Name>zen</Name>
			<Title>Zen Browser</Title>
			<Description>Zen is a firefox-based browser with the aim of pushing your productivity to a new level.</Description>
			<Icon>zen.png</Icon>
		</Package>
    </Software>
    <FeaturePages>
        <RadioImagePage CheckDefaultBrowser="true" DependsOn="software"
            DefaultOption="browser-helium" IsRequired="true"
            Description="Please select a preferred browser. Helium is highly recommended. We can only provide a curated experience for some options.">
            <Options>
                <RadioImageOption None="true" />
                <RadioImageOption>
                    <Text>Helium</Text>
                    <Name>browser-helium</Name>
                    <FileName>helium</FileName>
                    <GradientTopColor>#392DD1</GradientTopColor>
                    <GradientBottomColor>#A91B78</GradientBottomColor>
                </RadioImageOption>
                <RadioImageOption>
                    <Text>Zen</Text>
                    <Name>browser-zen</Name>
                    <FileName>zen</FileName>
                    <GradientTopColor>#FF3647</GradientTopColor>
                    <GradientBottomColor>#FFC742</GradientBottomColor>
                </RadioImageOption>
            </Options>
            <BottomLine Text="Privacy comparison" Link="https://privacytests.org/" />
        </RadioImagePage>
        <RadioPage DefaultOption="disable-defender" Description="Disabling Windows Defender can improve system performance, but at the cost of security.">
            <Options>
                <RadioOption>
                    <Text>Disable Defender (Default)</Text>
                    <Name>disable-defender</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Enable Defender</Text>
                    <Name>enable-defender</Name>
                </RadioOption>
            </Options>
        </RadioPage>
        <RadioPage DefaultOption="disable-hibernate" Description="Disabling frees disk space and prevents dual-boot or upgrade instability.">
            <TopLine Text="This includes Fast Startup"/>
            <Options>
                <RadioOption>
                    <Text>Disable Hibernate (Default)</Text>
                    <Name>disable-hibernate</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Enable Hibernate</Text>
                    <Name>enable-hibernate</Name>
                </RadioOption>
            </Options>
            <BottomLine Text="⚠️ Disabling may overheat laptops in sleep mode"/>
        </RadioPage>
        <CheckboxPage IsRequired="true" Description="Please select which components you would like to include or exclude with this Playbook.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Microsoft Edge</Text>
                    <Name>remove-edge</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove OneDrive</Text>
                    <Name>remove-onedrive</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove AI (Recall &amp; Copilot)</Text>
                    <Name>remove-winsxs-ai</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Microsoft Teams</Text>s
                    <Name>remove-teams</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage IsRequired="true" Description="Please select which UWP Appx packages you would like to remove.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Photos</Text>
                    <Name>remove-appx-photos</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Dev Home</Text>
                    <Name>remove-appx-devhome</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Remove Xbox apps</Text>
                    <Name>remove-appx-xbox</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove 'Your Phone'</Text>
                    <Name>remove-appx-yourphone</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage IsRequired="true" Description="General configuration options">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Apply Slate wallpaper</Text>
                    <Name>configure-wallpaper</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Enable Dark Mode</Text>
                    <Name>configure-darkmode</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Enable Legacy Context Menu</Text>
                    <Name>configure-lcm</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Disable Transparency Effects</Text>
                    <Name>configure-te</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage IsRequired="true" Description="General configuration options, page 2">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Remove pinned items in Start Menu</Text>
                    <Name>remove-pinned-items-startmenu</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Disable Automatic Maintenance</Text>
                    <Name>disable-automatic-maintenance</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
    </FeaturePages>
</Playbook>